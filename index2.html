<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Personality Calculator</title>

    <link rel="stylesheet" href="style2.css">

</head>


<body>

    <div class="container">

        <div class="header">

            <span class="emoji">🧠</span>

            <h1>Personality Calculator</h1>

            <p>
                Discover your personality vibe!
            </p>

        </div>


        <!-- Quiz -->

        <div class="quiz-card" id="quizCard">

            <div class="progress-container">

                <div class="progress-bar" id="progressBar"></div>

            </div>

            <p class="question-number" id="questionNumber">
                Question 1 of 8
            </p>

            <h2 id="question">
                When you have free time, what do you prefer?
            </h2>


            <div class="options" id="options">

            </div>


            <button id="nextBtn">
                Next →
            </button>

        </div>


        <!-- Result -->

        <div class="result-card" id="resultCard">

            <div class="result-icon" id="resultIcon">
                🎯
            </div>

            <p class="result-label">
                YOUR PERSONALITY
            </p>

            <h1 id="resultTitle">
                The Explorer
            </h1>

            <p id="resultDescription">
                You love adventure and discovering new things.
            </p>


            <div class="score-container">

                <div class="score-circle">

                    <span id="score">
                        0
                    </span>

                    <small>
                        %
                    </small>

                </div>

            </div>


            <div class="traits" id="traits">

            </div>


            <button id="restartBtn">
                🔄 Take Quiz Again
            </button>

        </div>

    </div>


    <script src="script2.js"></script>

</body>

</html>
